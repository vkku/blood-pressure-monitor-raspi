version: "3.8"

services:
  blood-pressure-monitor:
    image: vkku/blood-pressure-monitor:latest
    container_name: blood-pressure-monitor
    ports:
      - "8082:8082"
    volumes:
      - bp-data:/app/database
    environment:
      - TZ=Asia/Kolkata
      - CONFIG_PATH=/app/config/config.yaml
      - DB_PATH=/app/database/blood_pressure.db
      - DB_DIR=/app/database
      - FRONTEND_PATH=/app/frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  bp-data:
    driver: local